# Конфіг tmux лише для сесій, запущених через start (shell/laserbeak.zsh).
#
# tmux тут не для його звичайних можливостей, а як посередник: він
# тримає псевдотермінал, у який Laserbeak може написати ззовні. Тому
# зовні його має бути якомога менше видно — жодних рамок і смужок.

# Статусної смужки не видно: вкладка WebStorm має виглядати як раніше.
set -g status off

# Мишка працює як звикла: прокрутка, виділення.
set -g mouse on

# Довга історія прокрутки — Claude Code виводить багато.
set -g history-limit 100000

# Кольори як у справжньому терміналі.
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Без затримки після Escape: інтерфейс Claude Code стає вʼялим.
set -sg escape-time 0

# Не чіпати розмір вікна під інші клієнти, коли їх кілька.
setw -g aggressive-resize on

# Закрита вкладка має вбивати сесію, а не ховати її.
#
# Закриття вкладки вбиває лише клієнта tmux — сама сесія лишалась
# відчепленою, і claude у ній далі тримав свої 300–400 МБ. Кілька таких
# за день з'їдали оперативну пам'ять, а знайти їх було ніде: у списку
# Laserbeak вони виглядали живими, бо панель існує.
#
# Ціна: випадково закрита вкладка вбиває хід, що йшов. Переписка при
# цьому ціла — claude --resume повертає сесію.
set -g destroy-unattached on
